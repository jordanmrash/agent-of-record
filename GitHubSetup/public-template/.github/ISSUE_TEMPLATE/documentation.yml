name: Documentation issue
description: Report an ambiguity, contradiction, or missing explanation.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
    validations:
      required: true
  - type: textarea
    id: ambiguity
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Intended reader
      description: Practitioner, accounting leader, developer, security reviewer, or contributor.
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
