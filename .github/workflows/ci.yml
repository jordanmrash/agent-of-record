name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # The gate runs on both platforms the repository claims to support. The
    # command bridge self-test starts the real server and exercises the
    # platform's own script shape - .bat through cmd.exe on Windows, .sh through
    # bash on macOS - so a refusal that holds on one and not the other fails
    # here rather than on a contributor's machine.
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate repository controls, demonstration and self-tests
        run: python scripts/release_check.py --json release-results-${{ matrix.os }}.json
      - name: Publish machine-readable results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-results-${{ matrix.os }}
          path: release-results-${{ matrix.os }}.json
      - name: Parse own-code MCP servers
        run: |
          node --check Startup/CommandBridge/batch-exec-server.js
          node --check Startup/FlowBridge/flow-mcp-server.js
      - name: POSIX launchers are executable and parse
        if: runner.os != 'Windows'
        run: |
          for f in Startup/posix/*.sh; do
            test -x "$f" || { echo "not executable: $f"; exit 1; }
            bash -n "$f"
          done
          echo "launchers: executable and parse clean"
